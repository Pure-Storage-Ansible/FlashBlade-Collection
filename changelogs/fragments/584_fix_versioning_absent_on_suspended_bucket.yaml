minor_changes:
  - purefb_bucket - The ``versioning`` parameter no longer defaults to ``absent``.
    Omitting it now leaves the bucket's versioning state unchanged. Set
    ``versioning`` to ``absent`` explicitly to suspend versioning on a bucket.
bugfixes:
  - purefb_bucket - Fixed idempotency error when ``versioning`` is ``absent`` and
    the bucket's versioning is already ``suspended``. The module sent the literal
    string ``absent`` to the API, which rejected it with "Versioning can only be
    set to 'enabled' or 'suspended'".
  - purefb_bucket - Fixed a task that does not specify ``versioning`` silently
    suspending versioning on an existing versioned bucket, because the parameter
    defaulted to ``absent``.
